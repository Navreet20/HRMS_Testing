name: Backend CI

on:
  push:
  pull_request:

# Every setting the app reads comes from the environment (there are no defaults in
# code), so both the schema step and pytest need the full set. Test values only.
env:
  PORT: "5001"
  DB_POOL_CLASS: "queue"
  DB_POOL_SIZE: "2"
  DB_MAX_OVERFLOW: "2"
  DB_POOL_PRE_PING: "true"
  DB_POOL_RECYCLE: "280"
  DB_POOL_TIMEOUT: "30"
  JWT_SECRET: "ci-test-jwt-secret-not-for-production"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "480"
  CORS_ORIGINS: "http://localhost:3000"
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: "lax"
  COOKIE_DOMAIN: ""
  MINIO_ENDPOINT: "localhost:9000"
  MINIO_ACCESS_KEY: "ci-minio-access"
  MINIO_SECRET_KEY: "ci-minio-secret"
  MINIO_BUCKET: "hrms-documents"
  MINIO_SECURE: "false"
  FIELD_ENCRYPTION_KEY: "ci-test-field-encryption-key-32b!!"
  ONBOARDING_SEND_INVITE_EMAIL: "false"
  AUTH_BYPASS: "false"
  ENVIRONMENT: "development"
  SUPERADMIN_EMAILS: "developer@example.com"
  EMAIL_PROVIDER: "smtp"
  NOTIFICATION_WORKER_ENABLED: "false"
  NOTIFICATION_POLL_SECONDS: "0"
  TEMPLATE_REFRESH_SECONDS: "0"
  SMTP_ENABLED: "true"
  SMTP_HOST: "smtp.ci.local"
  SMTP_PORT: "587"
  SMTP_SECURITY: "starttls"
  SMTP_USER: "ci"
  SMTP_PASS: "ci"
  SMTP_FROM_EMAIL: "noreply@example.com"
  SMTP_FROM_NAME: "EAOVA"
  APP_PUBLIC_URL: "http://localhost:3001"
  TENANT_ID: "00000000-0000-0000-0000-000000000001"
  CLIENT_ID: "00000000-0000-0000-0000-000000000002"
  CLIENT_SECRET: "ci-entra-client-secret"
  REDIRECT_URI: "http://localhost:5001/api/v1/auth/entra/callback"
  MSAL_REDIRECT_URI: "http://localhost:3000"
  SCOPES: "openid profile email User.Read"
  GEOCODER_BASE_URL: "https://photon.komoot.io"
  GEOCODER_USER_AGENT: "HRMS-CI/1.0"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hrms_local_dev
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        # Waits until Postgres is actually ready before tests start,
        # not just "the container started".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up database schema
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: hrms_local_dev
          DB_NAME: hrms_test
          DB_SSL: "false"
        run: python scripts/bootstrap_db.py --schema-only

      - name: Run pytest
        env:
          # Points at the disposable service container above, not any
          # persistent shared database. Matches app/core/config.py's
          # individual DB_* fields, not a combined DATABASE_URL.
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASS: hrms_local_dev
          DB_NAME: hrms_test
          DB_SSL: "false"
          # Database tests read only this (see tests/helpers/db.py); SSL is off
          # because no sslmode is given.
          TEST_DATABASE_URL: postgresql://postgres:hrms_local_dev@localhost:5432/hrms_test
          # Fail the run if the database tests would be skipped (see tests/helpers/db.py).
          REQUIRE_DB_TESTS: "1"
          TESTING: "1"
          SUPERADMIN_EMAILS: "developer@example.com"
          ENVIRONMENT: "development"
          JWT_SECRET: "ci-test-jwt-secret-not-for-production"
          FIELD_ENCRYPTION_KEY: "ci-test-field-encryption-key-32b!!"
        run: pytest