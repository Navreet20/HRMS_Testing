[project]
name = "hrms-backend"
version = "0.1.0"
description = "HRMS backend API"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used by CI).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2,bcrypt]>=0.2.1",
    "python-multipart>=0.0.17",
    "aiosmtplib>=3.0.0",
    "httpx>=0.28.0",
    "anyio>=4.6.0",
    "alembic>=1.14.0",
    "minio>=7.2.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.0",
]

[tool.uv]
# An application, not a library: install the dependencies only.
package = false
